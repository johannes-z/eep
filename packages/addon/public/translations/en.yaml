---
configuration:
  adapter:
    name: Adapter
    description: >-
      The path to the serial device, can either a local device /dev/serial/by-id/..., or tcp://address:port
  adapter_type:
    name: Adapter type
    description: The transport type used for the configured adapter.
  baud_rate:
